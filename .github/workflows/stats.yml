name: Atualizar estatísticas

on:
  schedule:
    - cron: "0 6 * * *" # todo dia às 3h (horário de Brasília)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/stats.mjs
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats
          git diff --cached --quiet || git commit -m "Atualiza estatísticas"
          git push
